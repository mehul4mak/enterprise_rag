name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: phase1_rag_agent

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit tests
        # Excludes tests/acceptance.py (needs an LLM backend); unit tests are offline.
        run: pytest tests/test_chunking.py tests/test_grounding.py tests/test_api.py tests/test_providers.py
